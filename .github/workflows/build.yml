name: Python Build & Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Select which databases to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - all_except_porto
          - porto_only

env:
  SERVER: ${{ secrets.SERVER }}
  USER: ${{ secrets.USER }}
  MOT: ${{ secrets.MOT }}

jobs:
  deploy-databases:
    name: Deploy Databases Except Porto Alegre
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.deployment_target == 'all' || github.event.inputs.deployment_target == 'all_except_porto'
    runs-on: ubuntu-latest
    environment: mybus
    env:
      EXCLUDED_DATABASES: PortoAlegre_Brazil

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize deployment summary
        run: |
          echo "# GTFS Deployment" > "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run ID: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered by: $GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip \
            libpq-dev python3-dev build-essential
          pip3 install psycopg2

      - name: Deploy database
        run: |
          PYTHONUNBUFFERED=1 python3 createAllDB.py

  deploy-porto-alegre:
    name: Deploy Porto Alegre Database
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.deployment_target == 'all' || github.event.inputs.deployment_target == 'porto_only'
    runs-on: ubuntu-latest
    environment: mybus
    timeout-minutes: 60
    env:
      INCLUDED_DATABASES: PortoAlegre_Brazil

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize deployment summary
        run: |
          echo "# GTFS Deployment" > "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run ID: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered by: $GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip \
            libpq-dev python3-dev build-essential
          pip3 install psycopg2

      - name: Deploy Porto Alegre database
        run: |
          PYTHONUNBUFFERED=1 python3 createAllDB.py